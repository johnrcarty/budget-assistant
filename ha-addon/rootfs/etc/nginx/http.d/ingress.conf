# Home Assistant's Supervisor strips its dynamic
# /api/hassio_ingress/<token> prefix before forwarding a request to
# ingress_port, so the Next.js app behind this proxy only ever sees
# root-relative paths - but it sends the stripped prefix back via the
# X-Ingress-Path header specifically so it can be re-applied here. This
# rewrites the small, enumerable set of root-absolute asset references the
# app actually emits server-side (see src/app/layout.tsx's manifest link,
# next/font, and Next's /_next/ static chunks). It deliberately does NOT
# and CANNOT fix client-router-constructed URLs (<Link>, RSC prefetch,
# Server Action posts) - those are a separate, only-verifiable-on-real-HA
# risk tracked in the epic plan.
server {
    listen 8099;

    # Accept-Encoding "" disables upstream gzip - sub_filter can't rewrite
    # a compressed body.
    proxy_set_header Accept-Encoding "";
    # $host strips the port by nginx's own definition (a well-known nginx
    # quirk) - $http_host preserves whatever the client's raw Host header
    # actually was, port included. Using $host here made Next.js's built-in
    # Server Actions CSRF check reject every login/form submission: it
    # compares the browser's Origin header (which DOES include the port,
    # e.g. "192.168.1.4:8099") against the forwarded host, and a
    # port-stripped mismatch ("192.168.1.4" vs "192.168.1.4:8099") is
    # exactly the "Invalid Server Actions request" error this produced.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Ingress-Path $http_x_ingress_path;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Raised from nginx's 1m default - CSV transaction/income imports and
    # the Backup & Restore screen's .dump upload both come through here,
    # and dumps grow with transaction history, so leave generous headroom.
    client_max_body_size 512m;

    # text/html is sub_filter's own implicit default type - listing it here
    # too just produces a harmless "duplicate MIME type" warning at startup.
    sub_filter_types application/javascript application/json;
    sub_filter_once off;
    sub_filter '/_next/' '$http_x_ingress_path/_next/';
    sub_filter '"/manifest.json"' '"$http_x_ingress_path/manifest.json"';
    sub_filter '/favicon.ico' '$http_x_ingress_path/favicon.ico';

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
