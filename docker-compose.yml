services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: monthly_budget
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d monthly_budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:budget@db:5432/monthly_budget
      AUTH_SECRET: ${AUTH_SECRET}
      HOUSEHOLD_LOGIN_EMAIL: ${HOUSEHOLD_LOGIN_EMAIL}
      HOUSEHOLD_LOGIN_PASSWORD: ${HOUSEHOLD_LOGIN_PASSWORD}
      SIMPLEFIN_ENCRYPTION_KEY: ${SIMPLEFIN_ENCRYPTION_KEY}
      # Optional - enables AI categorization suggestions (Claude Haiku).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional - enables the MCP endpoint for Home Assistant Assist.
      # Unset = endpoint disabled (returns 503). See docs/mcp-home-assistant.md.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - "3410:3000"
    command: sh -c "node_modules/.bin/tsx src/server/db/migrate.ts && node server.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:budget@db:5432/monthly_budget
      SIMPLEFIN_ENCRYPTION_KEY: ${SIMPLEFIN_ENCRYPTION_KEY}
    command: node_modules/.bin/tsx src/server/jobs/scheduler.ts

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: budget
      PGPASSWORD: budget
      PGDATABASE: monthly_budget
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup/backup.sh:/scripts/backup.sh:ro
      - ./scripts/backup/restore.sh:/scripts/restore.sh:ro
      - ./scripts/backup/crontab:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "8"]

volumes:
  db-data:
